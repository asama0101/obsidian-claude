                    - generic [ref=e164]:
                      - paragraph [ref=e165]: 2019.11.16
                      - heading "｢話がつまらない人｣と面白い人の決定的な差とは？" [level=1] [ref=e166]
                      - paragraph [ref=e167]: 日頃頑張っているのになかなか結果が出ない、うまくいかないと悩んでいるアナタ。その原因は相手に対するアプローチの方法が間違っているだけかもしれません。『うまくやる ～コミュニケーションが変わる25のレッスン～』を上梓したクリエイティブディレクター熊野森人さんが、直面する壁を乗り越えるヒントを教えてくれました。
                      - generic [ref=e168]:
                        - term [ref=e169]: "CREDIT :"
                        - definition [ref=e170]:
                          - paragraph [ref=e171]: 文／熊野森人（クリエイティブディレクター）
                      - list [ref=e172]:
                        - listitem [ref=e173]:
                          - link "#LIFESTYLE" [ref=e174] [cursor=pointer]:
                            - /url: /lifestyle
                        - listitem [ref=e175]:
                          - link "#東洋経済ONLINE" [ref=e176] [cursor=pointer]:
                            - /url: /tags/toyokeizai_online
                  - generic [ref=e179]:
                    - text: 記事提供／
                    - link "東洋経済ONLINE" [ref=e180] [cursor=pointer]:
                      - /url: https://toyokeizai.net/
                  - figure [ref=e182]
                  - generic [ref=e187]: 会議でも、営業先でも、一生懸命プレゼンしているのに、なかなか伝わらないし、共感や賛同を得られない。そんなうまくいかない「壁」を前にして、「どうせ自分は……」と諦めてしまっていることはないだろうか？ そして、その原因が自分のコミュニケーション能力が劣るからでも、努力が足りないからでもなく、相手に対するアプローチの方法が間違っているだけだとしたらどうだろう？今回は初の著書となる『うまくやる ～コミュニケーションが変わる25のレッスン～』を上梓した、クリエイティブディレクターであり大学講師の熊野森人氏が、ちょっと意識するだけで「つまらない話がわかりやすく魅力的な話へと変わる」コミュニケーションのポイントを解説する。
                  - generic [ref=e190]: PAGE 2
                  - heading "例える時には相手が知っていることで！" [level=2] [ref=e195]
                  - generic [ref=e196]: 私はクリエイティブディレクターという仕事柄、たくさんの人とお会いしますが、どんなに難しい分野のお仕事をされていても、スマートな人に限って、わかりやすく、やさしく、かつ面白くお話しくださいます。今回はそのような方たちがどんなふうにお話をしているのか？ そのポイントを紹介していきたいと思います。
                  - figure [ref=e200]:
                    - generic [ref=e205]: わかりやすく話す人はどんなふうに話しているのでしょうか（イラスト：柳田義幸 『うまくやる～コミュニケーションが変わる25のレッスン～』より）
                  - generic [ref=e207]: まずはテクニックから。よく聞き上手は話し上手などと言われますが、例え上手も、聞き上手に勝るとも劣らないコミュニケーションテクニックと言えます。例えるというのは、じぶんがわかっていても、相手がわからない場合に、その相手がわかるようなものに、形を変えて説明することです。その道の一流と言われる人は例え話もわかりやすいものです。では、わかりやすく例えるにはどうしたらいいのでしょうか？例えるコツは、相手が知っているであろうことで細かく伝えるということが大事です。ただそう言われてもパッとできるものではありませんよね。ただ、次の3ステップを踏めば、誰でも大体は例えられるようになります。
                  - heading "ステップ1：例えるものを、色、形、音、香り、手触り、味など五感に分解し、色なら同じ色のものを集めます。 ステップ2：次にその中から特に似ているものを選びます。このタイミングで、相手の年齢や性別、性格などを考慮したうえで伝わるものなのかどうかを思案します。 ステップ3：伝わるだろうなと思うベスト3の1位から順に相手に説明していきます。" [level=4] [ref=e214]: ステップ1：例えるものを、色、形、音、香り、手触り、味など五感に分解し、色なら同じ色のものを集めます。ステップ2：次にその中から特に似ているものを選びます。このタイミングで、相手の年齢や性別、性格などを考慮したうえで伝わるものなのかどうかを思案します。ステップ3：伝わるだろうなと思うベスト3の1位から順に相手に説明していきます。
                  - generic [ref=e215]: PAGE 3
                  - generic [ref=e217]: では、実際に日本の蕎麦をまったく知らない外国の方に、蕎麦を説明する場合を考えてみましょう。みなさんも頭の中で例えてみてください。私の例えはこうです。蕎麦はまずパスタのような麺類であり、中華麺のように縮れておらずまっすぐで、スパゲティの3分の2くらいの長さと、同じくらいの太さである。また、スパゲティ同様乾麺なので、食べる際には湯がいて柔らかくして食べる。色は、クリーム色ではなくブラウングレーで、蕎麦の種類によっては、バニラビーンズのような小さな粒々が見えるものもある。あえて言うならば黒ゴマプリンか？ 蕎麦自体の味はスパゲティと同じく穀物の味で淡白なので、味付けは濃いコンソメスープのようなものにつけて食べる。みたいな感じになります。いかがでしょうか？ 黒ゴマプリンがちょっと厳しかったかもしれませんね。ただ、これを繰り返していたら例える力は自然と身に付きます。
                  - heading "いまやブランディングはストーリー全盛" [level=2] [ref=e223]
                  - generic [ref=e224]: 次は話の内容、ストーリーについてです。今や人気アイドルでさえ、生活感あふれる話や失敗談など一見、イメージを損なうような話を取り入れてファンに親近感を与えようとしています。なぜなら、今の時代は個々人の演出の仕方において、完璧に見せようとすればするほど、人はそこに違和感覚えてしまうから。では、実際に人はどんな話に反応をするのでしょうか。昨今のブランディングでは必ず用いられる手法にストーリーテリングというものがあります。これは、事実をただ単に伝えることではなく、人の想いが感じられる物語や、話をつくることを指します。小説、映画、ゲーム、ドキュメンタリー、なんでもそうですが、人は話に共感するもの。事実や、コンセプト、機能といった単発の情報よりも、話として組み立てられているほうが、認知や共感が深いのです。面白いストーリー、感動するストーリー、考えさせられるストーリー、すべてに共通すること、それは涙と笑いの両方があるということです。例えば、恵まれない環境から山あり谷ありの努力でじぶんと新しい環境を切り開き、最後には思いもよらなかった大成功が待っていた、みたいな話は多くの人が好むストーリーと言えるでしょう。つまり、あまりよくない状況が描かれてからの、よい状況への好転が、人の心を揺さぶるわけです。ただ、これをじぶんごと化するとなった途端に、あまりよくない状況＝じぶんの「弱さ」を出すことに多くの人が臆病になります。キレイなじぶんだけを（会社だけを）見せていたい、すごいと思わせたい、だからじぶんたちの弱さなんて見せたら大変な損失だ、みたいな思考に大抵は陥って、そこで止まってしまうのです。
                  - generic [ref=e227]: PAGE 4
                  - generic [ref=e229]: 基本的に人は、ストーリーに織り込まれる事柄が、「こんなにもうまくいった」「じぶんすごい！」という情報だけだと、その人や会社に対して悲しいかな、嫌悪感を持ちます。嫌な自慢しいの奴とでも言うのでしょうか。結果、よく見せたいのに、これでは、逆効果となってしまいます。人生、うまくいくことばかりではないのは、全人類共通の実感としてあるのに、そのうまくいっていないことは恥として隠す。まだ、昔であれば隠し通せたかもしれないですが、インターネットがあり、全人類ジャーナリストとなった今、隠すことのほうがイメージに弊害があることが多くなってきています。とはいえ、お笑い芸人でもないのに、自分の弱みで惹きつけるなんて嫌だなと思う人も多いでしょう。ただこれは何も現在進行中のうまくいってないことや、問題をリアルタイムで開示して、自分を切り売りするということではまったくありません。過去にあったうまくいかなかったこと、失敗した話など、そこからの教訓や、復活、修復の仕方などとセットで弱さを共有することで、魅力的なストーリーとして人の心に響きます。
                  - heading "エンゲージメントを強固にするのは人間味" [level=2] [ref=e235]
                  - generic [ref=e236]: マーケティングの世界に「エンゲージメント」という言葉がありますが、これは人や、企業、商品、サービス、ブランドなどに対してお客さんがどれだけ愛着を持っているかの状態を測るものです。
                  - generic [ref=e246]:
                    - heading "『うまくやる ～コミュニケーションが変わる25のレッスン～』" [level=4] [ref=e248]
                    - paragraph [ref=e252]: 京都精華大デザイン学部で10年以上続いているコミュニケーション論の講義をまとめた一冊。著者が長年ブランディングや、広告制作、大学での講義を通して培ってきたコミュニケーションデザインをベースに、日常生活やビジネスシーンでも使える考え方や知恵を紹介します。日頃頑張っているのになかなか結果が出ない事柄やうまくいかない事柄といった「壁」のようなものを乗り越えるヒントが詰まっています。著者／熊野森人 あさ出版刊 本体1400円＋税
                  - generic [ref=e253]: PAGE 5
                  - generic [ref=e255]: このエンゲージメントが強ければ強いほど、商品やサービスを新たに買ってくれる、または継続的に買ってくれることになります。例えば、ミュージシャンや俳優のファンの方に多かったりしますが、彼ら、彼女らが何かしら軽度の不祥事を起こしても、その関係性が崩れることがほぼない関係。これこそが本当にエンゲージメントが高い関係だと言えるでしょう。誰しもがじぶんのことを世間に公開して、いろいろな批判にさらされ、平常でいられるハートを持っているとも思わないですが、なんらかの関係性を望むために、じぶんを公開することを選ばれた人は、ぜひうまくいっている面だけでなく、うまくいっていなかった面、プラスそこからの復活も見せることを意識してストーリーを演出してみるといいでしょう。個人なら、過去の恋愛話、先生や上司に怒られた話、イキがっていた時代の香ばしい話、組織なら、業績が悪かった商品やサービスの話、返品が相次いだ話、開発時のもめ事などなど、いろんなお話が人の心をつかみます。これらは総じて人間味があるから、面白いのです。そう考えると、いろんな演出よりも、等身大の人間がいちばんのコンテンツなのかもしません。
