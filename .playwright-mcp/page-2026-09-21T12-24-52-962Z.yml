                    - paragraph [ref=e1048]: イタリア生まれのフード＆ライフスタイルライター、マッシさん。世界が急速に繋がって、広い視野が求められるこの時代に、日本人とはちょっと違う視点で日本と世界の食に関する文化や習慣、メニューなどについて考える連載です。
                - listitem [ref=e1049]:
                  - link [ref=e1051] [cursor=pointer]:
                    - /url: /series/series40
                  - link "デキる大人は知っている!? 「腕時計の基礎知識」 腕時計は単なるツールではなく、あなたがどんな人かを表すキーアイテムです。デキる男たちの間では共通言語であり、時には通行手形にもなる。だから、腕時計を知ると世界が広がるのです。一見、難しそうに思える専門用語や知識も、基本を押さえれば、見るべきポイントがわかってくるはず。奥深く魅力的な腕時計の世界へのガイドとして、ご活用ください。" [ref=e1053] [cursor=pointer]:
