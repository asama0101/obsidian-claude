            - heading "2. ルールを決める" [level=2] [ref=e171]
            - paragraph [ref=e172]: 次の会議に入る前に、メモ取りの際に従うべきルールを決めましょう。見た目が美しい方法を見つけるのには時間がかかるかもしれません。しかし、ルールを決めることはメモ取りを効率化させる上でとても重要な決断です。
            - list [ref=e173]:
              - listitem [ref=e174]: ・ 毎ページの主題はどのような感じにしますか？
              - listitem [ref=e175]: ・ 副題は何ですか？
              - listitem [ref=e176]: ・ 色や特殊な文字や装飾をしますか？
            - paragraph [ref=e177]: 従うルールがあれば、メモを書いているうちに耳で聞いたことが意味を成していき、後で立ち戻ってメモを読み返したときに、素早く理解できるようになります。
            - paragraph [ref=e178]: ルールに加えて、色を加えて書くのも良い方法です。重要なポイントにハイライトをつけたり図で表現できるよう、メモを見返す間にメモに色をつけるのです。
