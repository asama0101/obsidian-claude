          - generic [ref=e122]:
            - paragraph [ref=e123]: どんな会議でもメモを取るスキルは必要になってきます。思考を雲らせてしまうメモもあれば、記憶を助けてくれるメモもあります。そして、一番良いメモは、新しい考えを生み出したり、新たな見識を明らかにするようなメモです。
            - paragraph [ref=e124]: メモ取りのプロであるMathias Jakobsen氏と膝を交え、メモ取りの技術を向上させるコツ、そして、順序立てて考えるコツをお聞きしました。
            - paragraph [ref=e125]: Mathias氏は長年にわたり「わかりやすいメモを取る技術」を磨いてきました。彼はフォトグラファーからスタートし、グラフィックファシリテーターを経て、現在はHyper Islandのラーニングデザイナーをしています。Hyper Islandで、世界中の管理職の人々の学習を促進させるため、Mathias氏は独自のメモ取り方法を活用しています。
            - paragraph [ref=e126]: Mathias氏の助言によると、今すぐできる3つの方法で、メモの取り方が上手になるそうです。
