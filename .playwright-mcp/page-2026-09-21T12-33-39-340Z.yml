            - heading "1. アイデアにスペースを与える" [level=2] [ref=e159]
            - paragraph [ref=e160]: 時間軸に沿った方法でメモを取り、それぞれのページが絡み合ったアイデアでいっぱいになり、その結局、全てが同じ平面上に存在しているということは、よくあることです。
            - paragraph [ref=e161]:
              - text: いいアイデア、または、平凡なものでも、アイデアがあるときはすぐに十分なスペースを空けて書きます。
              - strong [ref=e162]: 書いたアイデアの左右どちらかの端を3行分空けておきましょう。
              - text: もしアイデアが重要なものであるのなら、そのアイデアのためのページを1ページ設けましょう。
            - paragraph [ref=e163]: より多くの紙を使うことになりますが、メモは格段にわかりやすくなり、後でアイデアを見返したときに、ゆとりを持って考えることができます。
