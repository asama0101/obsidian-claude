            - paragraph [ref=e92] [cursor=pointer]: INDEX
            - generic [ref=e93]: 伝わるパワーポイント資料を作るコツの1つは「色」にあります（写真：mits／PIXTA）
            - generic [ref=e95]: せっかく時間をかけて作った資料なのに、なぜかわかりにくかったり、いまいちカッコ悪かったり、評価されなかったり……。そんな悩みを解決するパワーポイントの即効テクニックを、SNSにアップロードしたパワポ画像のわかりやすさと面白さが話題になっている“パワポ芸人”の豊間根青地（とよまね・せいち）氏が伝授します。今回は「色の使い方」です。
            - generic [ref=e96]:
              - text: ※本稿は豊間根氏の新著『
              - link "秒で使えるパワポ術 一瞬で操作、一瞬で解決" [ref=e97] [cursor=pointer]:
                - /url: https://www.amazon.co.jp/dp/4041124263?tag=toyokeizaia-22&linkCode=ogi&th=1&psc=1
              - text: 』を一部抜粋・再構成したものです。
            - link "【写真を見る】悩むパワポの色使い｢グレー｣選べば失敗しない訳 メッセージが明確な資料に｢派手な色｣は不要(17枚)" [ref=e99] [cursor=pointer]:
              - /url: /articles/photo/624368
            - generic [ref=e103]:
              - iframe [ref=e104]:
