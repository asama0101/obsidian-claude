              - iframe [ref=e105]
            - heading "思い切って「グレーの世界」に飛び込んでみよう" [level=2] [ref=e106]
            - generic [ref=e107]: グレーは最強
            - paragraph [ref=e108]: 「Gray is the greatest.」――これは私がいつも口を酸っぱくしてお伝えしている格言です。青を使うか赤を使うかに迷っている時間があったら、とりあえず最強の色「グレー」を使ってみましょう。グレーは、あらゆるスライドで活躍する最強の武器だからです。
            - generic [ref=e109]: （筆者作成）
            - paragraph [ref=e111]: （外部配信先では図や画像を全部閲覧できない場合があります。その際は東洋経済オンライン内でお読みください）
            - strong [ref=e113]: カラフルにするとどこを見たらいいかわからない
            - paragraph [ref=e114]: グレーが最強な理由は、われわれ人間は派手な部分に自然と目が行く生き物だからです。あれも重要、これも重要……とあれこれといろんな色を使ってしまうと、どこを見たらいいのかよくわからないスライドができてしまいます。とにかく目を引くことが目的のチラシや看板ならそれでいい場合もありますが、スライドではそうはいきません。
            - strong [ref=e116]: まずグレー、重要部分に色
            - paragraph [ref=e117]: スライドを作る時は必ず最初に思い切って「グレーの世界」に飛び込みましょう。グレーの世界はいささか寂しいですが、本質を見定めるには絶好の舞台です。すべてをグレーの濃淡で示した後、重要な部分だけに絞って色を付けることで、見るべきポイントがわかりやすいスライドを作ることができるのです。
