          - paragraph [ref=f709e95]: 色をたくさん使わないほうがいいということはわかったけど、そうは言っても意味や属性が異なる図形をいくつか作り分けたいんだけど、どうしたらいいんだ……そう悩まれている方もいらっしゃるかもしれません。
          - strong [ref=f709e97]: 塗るか枠か、どちらか
          - paragraph [ref=f709e98]: そこでおすすめなのが、「塗るか、枠か」の使い分けです。たった1色で、対になるような2種類の要素を示すことができます。
          - paragraph [ref=f709e99]: なお、図形を塗りつぶすと背景と図形の色との違いが境界線になるので、「塗る」場合は枠は付けなくてOKです。逆に「枠」を付けるなら中は塗らないほうがスマートです。
          - generic [ref=f709e100]: （筆者作成）
