          - heading "無意味に色を使うと、とっ散らかっていく" [level=2] [ref=f603e90]
          - strong [ref=f603e92]: なんとなく塗り分けるな
          - paragraph [ref=f603e93]: 「ここには3つ要素があるから、3色で塗り分けるか……うーん、赤と青と緑でいいかな？」そんな風に、特別な理由なしになんとなく図形を塗り分けていませんか？ このように無意味にたくさん色を使うと、スライドはどんどんとっ散らかっていきます。
          - generic [ref=f603e94]: （筆者作成）
          - strong [ref=f603e97]: 3つあれば3種類だとわかる
          - paragraph [ref=f603e98]: このような塗分けをしてしまう背景には、「3種類の要素があるから、3種類の色で塗り分けないと」という思い込みがあります。しかし、「3種類ある」ということは、3つの図形が並んでいるのを見れば一発でわかります。わざわざ色でも「3つあること」を表現する必要はないのです。
          - generic [ref=f603e99]: （筆者作成）
          - generic [ref=f603e101]: （筆者作成）
          - strong [ref=f603e104]: 明確な理由があるなら塗り分けてもOK
          - paragraph [ref=f603e105]: ただし、メダルの色や会社のコーポレートカラーなど、共通認識となっている色があり、それを使うことによって一目でわかりやすくなるなら塗り分けてもよいでしょう。いずれにせよ、大事なのは「明確な目的を持って色を使う」ことです。
